services:
  postgres:
    image: postgres:16-alpine
    container_name: base-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: base
    ports: ["127.0.0.1:5442:5432"]
    volumes: ["base-pgdata:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 3s, retries: 20 }
volumes:
  base-pgdata:
